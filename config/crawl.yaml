# 采集节流策略：控制访问 X 的频率和总量，出现异常立即停止并自动冷却。
# 目的是让采集接近正常人浏览的强度、尽量少触发限流，而不是绕过 X 的检测：
# 不做浏览器指纹伪装、不换 IP、不轮换多个账号、不自动处理验证码。

# 只在本地时间这个时段内开始采集（24 小时制，含开始不含结束）
active_hours: [6, 23]

# 开始采集前随机等待（分钟），避免每天同一时刻准点访问
start_jitter_min: [0, 20]

budget:
  max_accounts_per_run: 50      # 每次最多采多少个账号；超过时按"超期最多"优先轮转，其余下次补收
  max_page_loads_per_run: 80    # 每次打开页面总数上限（主页 + 详情页）
  max_detail_per_run: 25        # 详情页补抓上限（按互动量从高到低）
  max_scrolls_per_account: 6    # 每个主页最多向下滚动几次

pacing:
  account_delay_sec: [8, 25]    # 两个账号主页之间的停留
  detail_delay_sec: [6, 18]     # 两个详情页之间的停留
  scroll_pause_ms: [1200, 3500] # 两次滚动之间的停顿
  long_break_every: [6, 10]     # 每打开这么多个页面，休息一次
  long_break_sec: [60, 180]     # 休息时长

# 同一账号两次采集的最短间隔（小时）
min_interval_hours: 20
# 账号没轮到的那几天不会丢内容：下次采集时从上次入库覆盖到的时间点开始补收，最多往回这么多天
# （需大于 schedule.max_days，留一天给随机延迟和偶尔没采成）
catch_up_days: 5

# 优 / 劣质账号：按最近 stats_days 天 AI 评审的平滑保留率分档；采集间隔按每天产出的合格内容排（见下面的 schedule）
# 平滑保留率 =（保留数 + prior_rate × prior_weight）/（评审数 + prior_weight）：每个账号先带 5 条 30% 的"虚拟样本"，
# 评审多的账号几乎不受影响，评审少的要连续通过才能升档（1/1 → 42% 普通，2/2 → 50% 优质，0/2 → 21% 普通）
# 2026-10-30 全部推文进评审后，整体保留率约 43%，优质线定在略高于平均
account_quality:
  stats_days: 14           # 统计最近 14 天的评审结果（建议 7–14 天）
  min_samples: 1           # 没有评审记录的账号为样本不足，按"普通"处理
  prior_rate: 0.3
  prior_weight: 5          # 0 = 不平滑，直接用保留率
  good_keep_rate: 0.45     # 平滑保留率 ≥ 45%：优质
  poor_keep_rate: 0.2      # 平滑保留率 < 20%：低质
  inactive_days: 14        # 超过 14 天没发推：不活跃，每 max_days 天采一次
  # 采集间隔：每天合格条数 = 平滑保留率 × 最近 14 天平均每天发帖数，大约每攒够 target_kept_per_crawl 条采一次
  #   ≥ 1.2 条/天：每天 | 0.6–1.2：隔天 | 0.4–0.6：每 3 天 | 更少：每 max_days 天
  # 少采不会丢内容（下次补收），只是晚几天进邮件。间隔小时 = min_interval_hours + 24 ×（天数 − 1）：20 / 44 / 68 / 92
  # 2026-10-30 按这套规则，101 个账号每天约需采 46 个，上限 50 留出余量给新账号
  schedule:
    target_kept_per_crawl: 1.2
    max_days: 4            # 最长几天采一次；不活跃、没有评审记录的也按这个
    poor_min_days: 2       # 低质账号产量再高也最多隔天采一次
    fast_max_days: 2       # 下面的官方号发布消息讲时效，最多隔天采一次（不活跃的除外）
    fast_accounts: [OpenAI, OpenAIDevs, claudeai, AnthropicAI, GoogleDeepMind, GeminiApp, MistralAI, MiniMax_AI, Kimi_Moonshot, perplexity_ai, AIatMeta, huggingface, cursor_ai, deepseek_ai, ollama, NousResearch, LangChain, Alibaba_Qwen, Zai_org]
  suggest_remove:          # 报告里建议从 topics.yaml 移出（不会自动删除）：评审 ≥ 8 条且保留率（未平滑）< 10%
    min_samples: 8
    max_keep_rate: 0.1

# 把一个 X 账号的关注列表同步进 topics.yaml（pnpm follows:sync，或后台账号页的"立即同步"）
# 只打开"正在关注"页往下滚动读取，不点任何按钮；冷却期内不运行，遇到限流、验证码、登录失效就停止并进入冷却。
# 只新增，不自动删除：取关的账号在后台标出来，由你决定是否移出；同步来的账号被你移出后，以后不会再加回来。
follow_sync:
  enabled: false           # true：每日任务在采集前按间隔自动同步一次
  # handle: your_handle    # 同步谁的关注列表；不写 = 采集用的 Chrome 里登录的账号
  every_days: 7            # 自动同步的间隔（天）
  max_accounts: 1000       # 一次最多读多少个关注对象
  topic:                   # 新账号放进这个主题；topics.yaml 里没有时自动新建
    id: following
    name: 我的关注
    color: "#0F766E"
    description: 我在 X 上关注的账号

# 采集端报告异常后的冷却期，期间 pnpm plan 不会安排采集
cooldown:
  rate_limited_hours: 24        # 限流 / 内容加载不出
  captcha_hours: 48             # 出现人机验证
  error_hours: 6                # 其他异常（同一账号重试一次仍失败、或连续两个账号失败时才停止；不随连续次数加倍）
  login_required: manual        # 登录失效：需要人工重新登录后运行 pnpm crawl:reset
  backoff_multiplier: 2         # 连续出现限流 / 验证码时，冷却期按倍数增加
  max_hours: 168                # 冷却期上限（7 天）
