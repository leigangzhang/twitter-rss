# 每日精选规则

# 发送时间（北京时间），只用于 launchd 定时任务模板和邮件标题日期
send_time: "07:00"
timezone: Asia/Shanghai

# 采集和精选的时间范围：
#   previous_day：只取前一天（按上面的 timezone，0:00–24:00）发布的推文，邮件标题显示该日期
#   rolling：取最近 window_hours 小时内发布的推文
collect_window: previous_day
window_hours: 24

digest:
  total_items: 60        # 每期最多条数（通过精选的都放进来，按分数排序，上限 60）；超出 mail.max_kb 时分卷发送
  min_per_topic: 1       # 每个已订阅主题至少保底几条（当天有合格内容时）
  candidates_per_topic: 30  # 规则粗筛后，每个主题每天送给 AI 评审的条数上限（按互动表现排序），控制 AI 成本；同一天重跑只补足到这个数

filters:
  include_replies: false   # 回复别人的推文
  include_reposts: false   # 纯转发
  min_text_length: 20      # 正文过短（且无图片、无引用、无外链）时丢弃
  min_quality: 3           # AI 质量分（5 分制：5 必读 / 4 值得读 / 3 有收获）低于此值不进入邮件

media_weight:
  text: 1.0
  image: 1.0
  video: 0.6               # 视频降权

video_mode: thumbnail      # thumbnail：显示视频封面 | summary：不显示封面，只有一行"视频 · 时长"

thread:
  merge: true              # 合并作者本人的连续推文
  max_parts: 8             # 超过时只显示前 N 条，并注明"另有 N 条"

# 订阅者可选语言：zh = AI 翻译成中文，只显示译文；orig = 保留原文
# AI 生成的视频说明、图片说明始终用中文
languages: [zh, orig]
default_language: zh       # 订阅页默认选中的阅读语言（新订阅），zh 中文 | orig 原文

# 推文或引用推文里的外部文章：抓取标题、封面和正文，在邮件里生成图文摘要
links:
  fetch: true              # 抓取文章（普通 HTTP 请求，不经过 X）
  summarize: true          # 对进入邮件的文章，用 DeepSeek 生成中文标题、概要和 3–5 条要点
  timeout_ms: 12000
  max_bytes: 3000000
  skip_domains: [x.com, twitter.com, t.co]   # 需要登录或没有正文的站点不抓取

mail:
  # 主题组合和语言完全相同的订阅者收到的内容一样，合并成一封邮件用密送（BCC）发出，减少 SMTP 发信次数。
  # 合并邮件里不能放每个人专属的管理/退订链接，改为通用入口：在网页输入邮箱，系统把专属链接发到该邮箱。
  # 只有一个人的组合仍单独发送，带专属链接。
  group_identical: true
  bcc_batch_size: 20       # 每封最多密送多少人（QQ 邮箱对单封收件人数有限制，不建议调太大）
  send_interval_ms: 1500   # 两封邮件之间的间隔
  tabs: true               # 主题标签页：苹果邮件、163 网页版等可切换主题；QQ、Gmail 网页版等自动按主题依次排列
  max_kb: 95               # 每封邮件大小上限（KB），Gmail 超过约 102KB 会折叠末尾；超出时分卷发送（标题注明 1/2、2/2）
  max_parts: 3             # 最多分几封；分满了仍放不下时去掉分数最低的条目（每个主题至少留一条），邮件里只有完整卡片。设为 1 = 不分卷
  feedback: false          # 每条推文下放 👍 / 👎 反馈链接（网站要能从外网打开）；合并发送的邮件还需要 .env 设置 FEEDBACK_SECRET

# 订阅页
subscribe_page:
  max_avatars: 7              # 每个主题卡片最多显示几个博主头像，超出显示 +N
  overwrite_existing: true    # 已订阅的邮箱重新提交订阅表单 = 直接改主题和语言（同时给该邮箱发变更通知）

rss:
  items_per_feed: 30       # 每个 Feed 保留最近多少条

# LLM 精选（详细标准写在 config/curation.md，可直接修改）
curation:
  # 只有这几类内容能进入邮件：best_practice 最佳实践与用法 / real_problem 真实世界问题 /
  # new_release 新发布与新能力 / showcase 应用案例与灵感 / industry_trend 行业趋势与解读 / expert_insight 专家思考
  allowed_categories: [best_practice, real_problem, new_release, showcase, industry_trend, expert_insight]
  editor_pass: true        # 单条评审后再做一次"编辑终审"：同一事件/同一观点只留最好的一条
  recent_days: 3           # 终审时对照最近 3 天已发过的内容，避免隔天重复
